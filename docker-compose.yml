services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docuchat
      POSTGRES_PASSWORD: docuchat
      POSTGRES_DB: docuchat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://docuchat:docuchat@db:5432/docuchat
    volumes:
      - models:/models
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  models:
